name: CodeQL
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build
        run: |
          if [ -f mvnw ]; then ./mvnw -DskipTests package
          elif [ -f pom.xml ]; then mvn -DskipTests package
          else echo "No Maven project found"; fi
      - uses: github/codeql-action/analyze@v3
